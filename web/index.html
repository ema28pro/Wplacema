      <style>
        /* ==========================================================================
           Intro Cinematográfica Wplace (Estilo aura difuminada, inicio pequeño a expansión)
           Paleta: #1c61e7, #3172e7, #4ad95b, #45cc55, #000000
           ========================================================================== */
        #intro-overlay {
          position: fixed;
          inset: 0;
          width: 100vw;
          height: 100vh;
          background-color: #000000;
          z-index: 999999;
          display: flex;
          align-items: center;
          justify-content: center;
          overflow: hidden;
          pointer-events: auto;
          transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #intro-overlay.fade-out {
          opacity: 0;
          pointer-events: none;
        }

        .intro-stage {
          position: relative;
          display: flex;
          align-items: center;
          justify-content: center;
          width: 440px;
          height: 440px;
          animation: introSequence 2.6s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
          will-change: transform, opacity;
        }

        /* Difuminado / Aura cromática multicapa con los colores exactos */
        .intro-aura {
          position: absolute;
          width: 380px;
          height: 380px;
          border-radius: 50%;
          background: radial-gradient(
            circle at center,
            rgba(74, 217, 91, 0.85) 0%,
            rgba(69, 204, 85, 0.7) 22%,
            rgba(49, 114, 231, 0.75) 48%,
            rgba(28, 97, 231, 0.45) 68%,
            rgba(0, 0, 0, 0) 80%
          );
          filter: blur(48px);
          animation: auraBreathe 2.4s ease-in-out infinite alternate;
        }

        /* Resplandor secundario para mayor profundidad y contraste en fondo negro */
        .intro-aura-outer {
          position: absolute;
          width: 520px;
          height: 520px;
          border-radius: 50%;
          background: radial-gradient(
            circle at center,
            rgba(49, 114, 231, 0.4) 0%,
            rgba(28, 97, 231, 0.25) 50%,
            rgba(0, 0, 0, 0) 75%
          );
          filter: blur(70px);
          animation: auraPulse 2.4s ease-in-out infinite alternate;
        }

        /* Ícono Tierra Pixel-Art perfectamente centrado con nítida definición y glow */
        .intro-logo {
          position: relative;
          width: 140px;
          height: 140px;
          image-rendering: pixelated;
          image-rendering: -moz-crisp-edges;
          image-rendering: crisp-edges;
          filter: drop-shadow(0 0 20px rgba(49, 114, 231, 0.95))
                  drop-shadow(0 0 35px rgba(69, 204, 85, 0.8));
          user-select: none;
          -webkit-user-drag: none;
        }

        /* Secuencia continua: acercamiento 100% fluido de escala 0.35 hasta un imponente 1.75x */
        @keyframes introSequence {
          0% {
            opacity: 0;
            transform: scale(0.35);
            filter: blur(14px);
          }
          18% {
            opacity: 1;
            filter: blur(0px);
          }
          100% {
            opacity: 1;
            transform: scale(1.75);
            filter: blur(0px);
          }
        }

        @keyframes auraBreathe {
          0% {
            transform: scale(0.85);
            opacity: 0.65;
          }
          100% {
            transform: scale(1.2);
            opacity: 1;
          }
        }

        @keyframes auraPulse {
          0% {
            transform: scale(0.9);
            opacity: 0.4;
          }
          100% {
            transform: scale(1.15);
            opacity: 0.9;
          }
        }
      </style>
    </head>
    <body>
        <!-- Pantalla de entrada cinemática Wplace -->
        <div id="intro-overlay">
            <div class="intro-stage">
                <div class="intro-aura-outer"></div>
                <div class="intro-aura"></div>
                <img class="intro-logo" src="./globe_icon.png" alt="Wplace Logo">
            </div>
        </div>
        <script>
            // Favicon animado: el globo pulsa con un resplandor verde/azul
            (() => {
                const icon = document.querySelector('link[rel="icon"]');
                const img = new Image();
                img.src = './globe_icon.png';
                const canvas = document.createElement('canvas');
                canvas.width = canvas.height = 64;
                const ctx = canvas.getContext('2d');
                let t = 0;
                img.onload = () => setInterval(() => {
                    t += 0.08;
                    const pulse = 0.5 + 0.5 * Math.sin(t);
                    ctx.clearRect(0, 0, 64, 64);
                    ctx.shadowColor = `rgba(74, 217, 91, ${0.4 + 0.6 * pulse})`;
                    ctx.shadowBlur = 4 + 8 * pulse;
                    ctx.drawImage(img, 8, 8, 48, 48);
                    icon.href = canvas.toDataURL('image/png');
                }, 100);
            })();
        </script>
        <script>
            // Desvanecimiento suave y autodestrucción del DOM para dejar 100% libre el mapa 3D
            window.addEventListener('DOMContentLoaded', () => {
                const overlay = document.getElementById('intro-overlay');
                if (!overlay) return;

                setTimeout(() => {
                    overlay.classList.add('fade-out');
                    setTimeout(() => {
                        overlay.remove();
                    }, 800);
                }, 2300);
            });
        </script>
        <noscript>
            <strong>Sorry but BlueMap doesn't work without JavaScript enabled.
                Please <a href="https://www.enable-javascript.com/">enable</a> it to continue.</strong>
        </noscript>
        <div id="map-container"></div>
        <div id="app"></div>
    </body>
</html>
